name: Release
on:
  push:
    tags: v*
permissions:
  contents: read
  id-token: write
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
      - run: corepack enable && corepack prepare npm@11.5.2 --activate
      - run: npm ci
      - run: npm publish --provenance --access public
